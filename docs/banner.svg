<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Group 6 Meta-Analysis Report Presentation">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="55%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>

    <linearGradient id="diamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#cbd5e1" opacity="0.75"/>
    </pattern>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#dots)"/>

  <!-- Ambient blobs -->
  <circle cx="120" cy="70" r="150" fill="#22d3ee" opacity="0.14"/>
  <circle cx="1180" cy="330" r="170" fill="#818cf8" opacity="0.14"/>
  <circle cx="1050" cy="60" r="110" fill="#34d399" opacity="0.10"/>

  <!-- Top accent strip -->
  <rect x="0" y="0" width="1280" height="7" fill="url(#accent)"/>

  <!-- ---------- LEFT: text block ---------- -->
  <g>
    <!-- badges -->
    <g filter="url(#soft)">
      <rect x="72" y="72" rx="17" width="322" height="34" fill="#ffffff" stroke="#a5f3fc"/>
      <circle cx="94" cy="89" r="5" fill="#06b6d4"/>
      <circle cx="94" cy="89" r="9" fill="#22d3ee" opacity="0.35"/>
      <text x="112" y="94" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0e7490">Systematic Review &amp; Meta-Analysis</text>
    </g>

    <g filter="url(#soft)">
      <rect x="406" y="72" rx="17" width="252" height="34" fill="#ffffff" stroke="#c7d2fe"/>
      <text x="426" y="94" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#4338ca">PRISMA 2020 · Cochrane RoB 2.0</text>
    </g>

    <!-- Title -->
    <text x="70" y="175" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#0f172a">Meta-Analysis Report</text>
    <text x="70" y="233" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#0f172a">Presenta<tspan fill="#0891b2">tion</tspan></text>

    <!-- Subtitle -->
    <text x="72" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#475569">A Quantitative Evidence Synthesis of Multi-Center Intervention Trials</text>

    <!-- Group pill -->
    <g filter="url(#soft)">
      <rect x="72" y="296" rx="24" width="176" height="48" fill="url(#accent)"/>
      <text x="160" y="327" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle">GROUP — 6</text>
    </g>

    <text x="266" y="315" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#0e7490">SMD = -0.43</text>
    <text x="266" y="336" font-family="Consolas, Menlo, monospace" font-size="13" fill="#64748b">95% CI [-0.52, -0.34]</text>

    <text x="418" y="315" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#059669">OR = 0.64</text>
    <text x="418" y="336" font-family="Consolas, Menlo, monospace" font-size="13" fill="#64748b">p &lt; 0.0001 · I² = 46.8%</text>

    <text x="560" y="315" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#4f46e5">18 RCTs</text>
    <text x="560" y="336" font-family="Consolas, Menlo, monospace" font-size="13" fill="#64748b">N = 12,450 participants</text>
  </g>

  <!-- ---------- RIGHT: forest plot mock ---------- -->
  <g filter="url(#soft)">
    <rect x="700" y="70" width="508" height="262" rx="22" fill="#ffffff" stroke="#e2e8f0"/>
  </g>

  <!-- panel header -->
  <text x="726" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#334155" letter-spacing="0.5">FOREST PLOT · 95% CI</text>
  <rect x="1064" y="86" rx="10" width="120" height="24" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="1124" y="103" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#0e7490" text-anchor="middle">Random D-L</text>
  <line x1="706" y1="120" x2="1202" y2="120" stroke="#e2e8f0"/>

  <!-- null line -->
  <line x1="1050" y1="130" x2="1050" y2="316" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="4 4"/>

  <!-- study rows: [x1,x2,cx,size,color] -->
  <!-- row 1 -->
  <g>
    <line x1="878" y1="148" x2="990" y2="148" stroke="#64748b" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="878" y1="141" x2="878" y2="155" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="990" y1="141" x2="990" y2="155" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="926" y="139" width="17" height="17" rx="3" fill="#0284c7" filter="url(#soft)"/>
    <text x="726" y="152" font-family="Consolas, Menlo, monospace" font-size="13" fill="#475569">Anderson 2020</text>
    <text x="1186" y="152" font-family="Consolas, Menlo, monospace" font-size="12" fill="#0e7490" text-anchor="end" font-weight="700">-0.48</text>
  </g>
  <!-- row 2 -->
  <g>
    <line x1="906" y1="180" x2="1014" y2="180" stroke="#64748b" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="906" y1="173" x2="906" y2="187" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="1014" y1="173" x2="1014" y2="187" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="952" y="171" width="15" height="15" rx="3" fill="#0284c7"/>
    <text x="726" y="184" font-family="Consolas, Menlo, monospace" font-size="13" fill="#475569">Davies 2021</text>
    <text x="1186" y="184" font-family="Consolas, Menlo, monospace" font-size="12" fill="#0e7490" text-anchor="end" font-weight="700">-0.55</text>
  </g>
  <!-- row 3 -->
  <g>
    <line x1="940" y1="212" x2="1076" y2="212" stroke="#64748b" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="940" y1="205" x2="940" y2="219" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="1076" y1="205" x2="1076" y2="219" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="1000" y="203" width="17" height="17" rx="3" fill="#0284c7"/>
    <text x="726" y="216" font-family="Consolas, Menlo, monospace" font-size="13" fill="#475569">El-Sayed 2022</text>
    <text x="1186" y="216" font-family="Consolas, Menlo, monospace" font-size="12" fill="#0e7490" text-anchor="end" font-weight="700">-0.22</text>
  </g>
  <!-- row 4 -->
  <g>
    <line x1="850" y1="244" x2="964" y2="244" stroke="#64748b" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="850" y1="237" x2="850" y2="251" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="964" y1="237" x2="964" y2="251" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="899" y="235" width="18" height="18" rx="3" fill="#0284c7"/>
    <text x="726" y="248" font-family="Consolas, Menlo, monospace" font-size="13" fill="#475569">Hernandez 2023</text>
    <text x="1186" y="248" font-family="Consolas, Menlo, monospace" font-size="12" fill="#0e7490" text-anchor="end" font-weight="700">-0.39</text>
  </g>
  <!-- row 5 -->
  <g>
    <line x1="808" y1="276" x2="930" y2="276" stroke="#64748b" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="808" y1="269" x2="808" y2="283" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="930" y1="269" x2="930" y2="283" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="861" y="267" width="18" height="18" rx="3" fill="#0284c7"/>
    <text x="726" y="280" font-family="Consolas, Menlo, monospace" font-size="13" fill="#475569">Kim &amp; Park 2024</text>
    <text x="1186" y="280" font-family="Consolas, Menlo, monospace" font-size="12" fill="#0e7490" text-anchor="end" font-weight="700">-0.67</text>
  </g>

  <!-- pooled diamond -->
  <g filter="url(#glow)">
    <polygon points="958,304 988,294 1018,304 988,314" fill="url(#diamond)" stroke="#0891b2" stroke-width="2"/>
  </g>
  <text x="726" y="309" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#0e7490">POOLED SUMMARY</text>
  <text x="1186" y="309" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#0e7490" text-anchor="end">-0.43 [-0.52, -0.34]</text>

  <!-- direction labels -->
  <text x="726" y="336" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#059669">◀ Favors Intervention</text>
  <text x="1200" y="336" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#e11d48" text-anchor="end">Favors Control ▶</text>
</svg>
